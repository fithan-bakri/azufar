<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Azzufar Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-900 via-blue-800 to-teal-700 min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4">
        <div class="max-w-md mx-auto bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-teal-500 p-8 text-white text-center">
                <div class="mb-3">
                    <img src="AZZUFAR.png" alt="Azzufar Logo"  class="w-20 mx-auto  "><br>
                <h1 class="text-4xl font-bold">Azzufar Management</h1>
                <p class="text-blue-100 mt-2">System Login</p>
            </div>
            
            <div class="p-8">
                <div id="errorMessage" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                    <span class="block sm:inline"></span>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">
                            <i class="fas fa-user mr-2"></i>Username
                        </label>
                        <input type="text" id="username" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-gray-600"
                            placeholder="Masukkan username">
                    </div>

                    <div>
                        <label class="block text-gray-700 font-semibold mb-2">
                            <i class="fas fa-lock mr-2"></i>Password
                        </label>
                        <div class="relative">
                            <input type="password" id="password" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-gray-600"
                                placeholder="Masukkan password">
                            <button type="button" onclick="togglePassword()" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700">
                                <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center">
                            <input type="checkbox" class="mr-2">
                            <span class="text-sm text-gray-600">Ingat Saya</span>
                        </label>
                    </div>

                    <button type="submit"
                        class="w-full bg-gradient-to-r from-blue-600 to-teal-500 text-white py-3 rounded-lg font-semibold hover:from-blue-700 hover:to-teal-600 transition transform hover:scale-105">
                        <i class="fas fa-sign-in-alt mr-2"></i>Login
                    </button>
                </form>
            </div>
        </div>
    </div>
     <script>
        // Inline Database and Auth for login page
        
        // Database
        const DB = {
            storage: {
                users: [
                    { id: 1, username: 'admin', password: 'admin123', role: 'admin', name: 'Administrator', email: 'admin@school.com' },
                    { id: 2, username: 'santri Azufar', password: 'santri Azufar123', role: 'santri Azufar', name: 'santri Azufar', email: 'guru@school.com' },
                    { id: 3, username: 'staff', password: 'staff123', role: 'staff', name: 'Staff Sekolah', email: 'staff@school.com' }
                ]
            },
            
            getUsers() {
                return this.storage.users;
            }
        };

        // Auth
        const Auth = {
            login(username, password) {
                const users = DB.getUsers();
                const user = users.find(u => u.username === username && u.password === password);
                
                if (user) {
                    // Save to sessionStorage for cross-page access
                    const sessionData = {
                        id: user.id,
                        username: user.username,
                        role: user.role,
                        name: user.name,
                        email: user.email,
                        loginTime: new Date().toISOString()
                    };
                    
                    sessionStorage.setItem('userSession', JSON.stringify(sessionData));
                    
                    return { success: true, user: sessionData };
                }
                
                return { success: false, message: 'Username atau password salah!' };
            }
        };

        // Toggle Password
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Login Form Handler
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                
                if (!username || !password) {
                    showError('Username dan password harus diisi!');
                    return;
                }
                
                const result = Auth.login(username, password);
                
                if (result.success) {
                    // Success - redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    showError(result.message);
                }
            });
        });

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('hidden');
            errorDiv.querySelector('span').textContent = message;
            
            setTimeout(() => {
                errorDiv.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
